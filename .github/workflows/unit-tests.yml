name: unit-tests

on:
  pull_request:
  push:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      # Diagnostics: a pull request from a fork must not see any secrets here.
      - name: Environment
        run: |
          echo "test"
          env | sort
          # Names only: GitHub log masking hides values, never names.
          echo "--- names only"
          env | cut -d= -f1 | sort
      - name: Unit tests
        run: python -m unittest discover -s tests/unit -t . -v
